<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>LiftIQ</title><link rel="manifest" href="manifest.webmanifest"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#e5e7eb;background:#0b1220}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:18px 16px 95px}h1{margin:0;font-size:26px}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}.muted{color:#9ca3af;font-size:13px}.card{background:#182335;border:1px solid #334155;border-radius:16px;padding:15px;margin:12px 0}.hero{background:linear-gradient(120deg,#172c37,#173b34)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.three{grid-template-columns:repeat(3,1fr)}button,select,input{font:inherit;border-radius:10px;border:1px solid #475569;background:#253246;color:white;padding:11px;min-width:0}button{cursor:pointer}button.primary{background:#22c55e;color:#052e16;border:0;font-weight:750}button.secondary{background:#334155}button.full{width:100%;margin-top:10px}button.active{border:2px solid #4ade80}input{width:100%}label{font-size:12px;color:#aab6c8;display:block;margin-bottom:5px}.field{flex:1;min-width:0}.pill{font-size:12px;background:#244a3b;color:#86efac;padding:5px 9px;border-radius:99px}.item{padding:12px 0;border-bottom:1px solid #334155}.item:last-child{border:0}.check{width:30px;height:30px;padding:0;border-radius:50%;margin-right:10px}.done{background:#166534}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#111827;border-top:1px solid #334155;padding:10px 5px calc(10px + env(safe-area-inset-bottom));justify-content:center;z-index:5}.nav button{flex:1;max-width:150px;border:0;background:transparent;color:#94a3b8;font-size:12px;padding:8px 2px}.nav button.active{color:#86efac;border:0}.bar{height:8px;background:#374151;border-radius:10px;overflow:hidden}.bar span{display:block;background:#4ade80;height:100%}.small{font-size:12px}.tag{color:#86efac;font-weight:650}.set{font-size:13px;padding:6px 0;color:#cbd5e1}.notice{font-size:12px;color:#fbbf24}.top{display:flex;align-items:center;justify-content:space-between;margin:7px 0 18px}</style></head><body><main><header class="top"><div><h1>🏋️ LiftIQ</h1><div class="muted">Train smart. Get stronger.</div></div><span class="pill">100% free</span></header><div id="app"></div></main><nav class="nav" id="nav"></nav><script>
const KEY='liftiq-v1';const DAYS=[{name:'Upper Strength',warm:[['Arm circles','30 sec'],['Thoracic rotations','8/side'],['Band pull-aparts','15 reps']],cool:[['Doorway pec stretch','30 sec/side'],['Lat stretch','30 sec/side'],['Cross-body shoulder stretch','30 sec/side']],lifts:[['Bench Press',3,5,8,185,5],['Pull-Up / Assisted Pull-Up',3,6,8,0,5],['Overhead Press',2,6,10,95,5],['Chest-Supported Row',2,8,12,100,5]]},{name:'Lower Strength',warm:[['Ankle rocks','10/side'],['Leg swings','10/side'],['Bodyweight squats','12 reps']],cool:[['Hip flexor stretch','30 sec/side'],['Hamstring stretch','30 sec/side'],['Calf stretch','30 sec/side']],lifts:[['Back Squat',3,5,8,225,10],['Romanian Deadlift',3,6,10,185,10],['Leg Press',2,10,12,270,10],['Leg Curl',2,10,15,90,5]]},{name:'Upper Hypertrophy',warm:[['Band pull-aparts','15 reps'],['Wall slides','10 reps'],['Thoracic rotations','8/side']],cool:[['Doorway pec stretch','30 sec/side'],['Lat stretch','30 sec/side'],['Biceps wall stretch','30 sec/side']],lifts:[['Incline DB Press',3,8,12,65,5],['Lat Pulldown',3,8,12,140,5],['Seated DB Press',2,8,12,45,5],['Cable Row',2,10,12,120,5],['DB Curl',2,10,15,25,5]]},{name:'Lower Hypertrophy',warm:[['Glute bridges','12 reps'],['Hip circles','10/side'],['Leg swings','10/side']],cool:[['Figure-four stretch','30 sec/side'],['Hamstring stretch','30 sec/side'],['Quad stretch','30 sec/side']],lifts:[['Romanian Deadlift',3,8,10,165,10],['Hack Squat',3,8,12,180,10],['Bulgarian Split Squat',2,8,12,35,5],['Seated Leg Curl',2,10,15,90,5]]}];
let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch{}s=Object.assign({tab:'Today',day:0,week:1,block:1,logs:[],draft:{},mob:{},cardio:[],weights:[{weight:217,date:new Date().toISOString().slice(0,10)}],goal:207,priority:'balanced'},s||{});const save=()=>localStorage.setItem(KEY,JSON.stringify(s));const $=id=>document.getElementById(id);const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toISOString().slice(0,10);const blockweek=()=>s.block*6-6+s.week;const namekey=(type,i)=>`${type}-${s.block}-${s.week}-${s.day}-${i}`;const last=name=>[...s.logs].reverse().find(x=>x.name===name);const target=e=>{let l=last(e[0]);if(!l)return e[4];let complete=l.sets.length>=e[1]&&l.sets.every(x=>x.r>=e[3]&&x.rir>=1);return Math.max(0,l.sets[0].w+(complete?e[5]:0))};const wrap=(t)=>`<div class="card">${t}</div>`;const nav=()=>{$('nav').innerHTML=['Today','Progress','History','Program','Settings'].map(t=>`<button class="${s.tab===t?'active':''}" onclick="setTab('${t}')">${{Today:'🏋️',Progress:'📈',History:'📋',Program:'🗓️',Settings:'⚙️'}[t]}<br>${t}</button>`).join('')};function setTab(t){s.tab=t;save();render()}function setDay(i){s.day=i;save();render()}function toggle(k){s.mob[k]=!s.mob[k];save();render()}function checklist(items,type){return items.map((x,i)=>{let k=namekey(type,i);return `<div class="row item"><button class="check ${s.mob[k]?'done':''}" onclick="toggle('${k}')">${s.mob[k]?'✓':'○'}</button><div style="flex:1">${esc(x[0])}</div><span class="muted">${esc(x[1])}</span></div>`}).join('')}
function todayView(){let d=DAYS[s.day];return wrap(`<div class="row"><div><h2>${d.name}</h2><span class="muted">Day ${s.day+1} · ~55 minutes</span></div><span class="pill">Week ${blockweek()}/12</span></div><div class="grid">${DAYS.map((x,i)=>`<button class="${i===s.day?'active':''}" onclick="setDay(${i})">${x.name}</button>`).join('')}</div>`)+wrap(`<div class="row"><h3>1. Dynamic mobility</h3><span class="muted">5 min</span></div>${checklist(d.warm,'warm')}`)+wrap(`<div class="row"><h3>2. Strength</h3><span class="muted">~30 min</span></div><p class="muted">Suggested weights are examples until your first real session. Edit each weight as needed.</p>${d.lifts.map((e,i)=>{let k=namekey('sets',i),sets=s.draft[k]||[];return `<div class="item"><div class="row"><div><b>${esc(e[0])}</b><div class="muted">${e[1]} sets × ${e[2]}–${e[3]} reps · next ${target(e)} lb</div></div><span class="pill">${sets.length}/${e[1]}</span></div><div class="grid three" style="margin-top:9px"><div><label>Weight lb</label><input id="w${i}" type="number" min="0" step="2.5" value="${target(e)}"></div><div><label>Reps</label><input id="r${i}" type="number" min="1" value="${e[2]}"></div><div><label>RIR</label><select id="rir${i}"><option>2</option><option>1</option><option>0</option><option>3</option><option>4</option></select></div></div><button class="primary full" onclick="addSet(${i})">+ Log set</button>${sets.map((x,j)=>`<div class="row set"><span>✓ Set ${j+1}: ${x.w} lb × ${x.r} · ${x.rir} RIR</span><button onclick="removeSet(${i},${j})">×</button></div>`).join('')}</div>`}).join('')}<button class="primary full" onclick="finish()">Save strength workout</button>`)+wrap(`<div class="row"><h3>3. Incline treadmill</h3><span class="muted">15 min target</span></div><p class="muted">Start around 3 mph and 3–6% incline, at a comfortable effort. A full mile at 3 mph takes 20 minutes.</p><div class="grid"><div><label>Speed mph</label><input id="speed" type="number" step="0.1" value="3"></div><div><label>Incline %</label><input id="incline" type="number" step="0.5" value="5"></div><div><label>Minutes</label><input id="minutes" type="number" value="15"></div><div><label>Distance miles</label><input id="distance" type="number" step="0.01" value="0.75"></div></div><button class="primary full" onclick="addCardio()">Save cardio</button>`)+wrap(`<div class="row"><h3>4. Cool-down stretches</h3><span class="muted">5 min</span></div>${checklist(d.cool,'cool')}`)}
function addSet(i){let e=DAYS[s.day].lifts[i],w=Number($('w'+i).value),r=Number($('r'+i).value),rir=Number($('rir'+i).value);if(!Number.isFinite(w)||w<0||!Number.isInteger(r)||r<1||r>100)return alert('Enter valid weight and reps');let k=namekey('sets',i);(s.draft[k]??=[]).push({w,r,rir});save();render()}function removeSet(i,j){s.draft[namekey('sets',i)].splice(j,1);save();render()}function finish(){let entries=DAYS[s.day].lifts.map((e,i)=>({name:e[0],sets:s.draft[namekey('sets',i)]||[],planned:e[1],min:e[2],max:e[3],step:e[5],day:s.day,week:s.week,block:s.block,date:today()})).filter(x=>x.sets.length);if(!entries.length)return alert('Log at least one set first');s.logs.push(...entries);DAYS[s.day].lifts.forEach((_,i)=>delete s.draft[namekey('sets',i)]);save();alert('Workout saved!');setTab('History')}function addCardio(){let c={speed:Number($('speed').value),incline:Number($('incline').value),minutes:Number($('minutes').value),distance:Number($('distance').value),date:today(),day:s.day,week:s.week,block:s.block};if(c.speed<0||c.incline<0||c.incline>30||c.minutes<=0||c.minutes>180||c.distance<0||Object.values(c).some(x=>typeof x==='number'&&!Number.isFinite(x)))return alert('Check cardio values');s.cardio.push(c);save();alert('Cardio saved!')}
function progressView(){let current=s.weights.at(-1).weight,lost=217-current;let sessions=s.logs.length,miles=s.cardio.reduce((a,c)=>a+c.distance,0);return wrap(`<h2>Body composition</h2><div class="grid three"><div><div class="muted">Current</div><h2>${current} lb</h2></div><div><div class="muted">Goal</div><h2>${s.goal} lb</h2></div><div><div class="muted">Lost</div><h2>${lost.toFixed(1)} lb</h2></div></div><div class="bar"><span style="width:${Math.max(0,Math.min(100,lost/10*100))}%"></span></div><p class="muted">10 lb in 12 weeks · ~0.83 lb/week target</p><div class="row"><div class="field"><label>Weigh-in (lb)</label><input type="number" id="weigh" step="0.1" value="${current}"></div><button class="primary" onclick="addWeight()">Save</button></div>`)+wrap(`<h3>Activity totals</h3><div class="grid three"><div><h2>${sessions}</h2><span class="muted">Lift entries</span></div><div><h2>${miles.toFixed(1)}</h2><span class="muted">Miles</span></div><div><h2>${s.cardio.reduce((a,c)=>a+c.minutes,0)}</h2><span class="muted">Cardio min</span></div></div>`)+wrap(`<h3>Weight history</h3>${[...s.weights].reverse().map(w=>`<div class="row item"><span>${w.date}</span><b>${w.weight} lb</b></div>`).join('')}`)+wrap(`<h3>Strength benchmarks</h3>${['Bench Press','Back Squat','Incline DB Press','Romanian Deadlift'].map(n=>{let ls=s.logs.filter(x=>x.name===n);return `<div class="row item"><span>${n}</span><b>${ls.length?Math.max(...ls.flatMap(l=>l.sets.map(x=>x.w*(1+x.r/30)))).toFixed(0)+' lb est. 1RM':'Not logged'}</b></div>`}).join('')}`)}function addWeight(){let v=Number($('weigh').value);if(!Number.isFinite(v)||v<80||v>500)return alert('Enter a valid weight');s.weights.push({weight:v,date:today()});save();render()}
function historyView(){return wrap(`<h2>Training history</h2>${!s.logs.length?'<p class="muted">No strength sessions logged yet.</p>':''}${[...s.logs].reverse().map(l=>`<div class="item"><div class="row"><b>${esc(l.name)}</b><span class="muted">${l.date}</span></div><div class="muted">Block ${l.block} · Week ${l.week}</div><div class="small">${l.sets.map(x=>`${x.w} × ${x.r}`).join(' | ')}</div></div>`).join('')}`)+wrap(`<h3>Cardio history</h3>${!s.cardio.length?'<p class="muted">No cardio logged yet.</p>':''}${[...s.cardio].reverse().map(c=>`<div class="item"><b>${c.distance} mi incline walk</b><div class="muted">${c.date} · ${c.minutes} min · ${c.speed} mph · ${c.incline}% incline</div></div>`).join('')}`)}
function programView(){let count=s.logs.filter(x=>x.block===s.block).length,hard=s.logs.filter(x=>x.block===s.block&&x.sets.some(y=>y.r<x.min)).length;return wrap(`<h2>Six-week program</h2><p class="muted">Block ${s.block} · Week ${s.week}/6 · Overall week ${blockweek()}/12</p><div class="grid three">${[1,2,3,4,5,6].map(w=>`<button class="${w===s.week?'active':''}" onclick="setWeek(${w})">Week ${w}</button>`).join('')}</div><p class="muted">Weeks 1–2: baseline. Weeks 3–5: progression. Week 6: reduced fatigue and review.</p>`)+wrap(`<h3>Next block</h3><label>Training priority</label><select id="priority" onchange="s.priority=this.value;save()"><option value="balanced" ${s.priority==='balanced'?'selected':''}>Strength + muscle</option><option value="strength" ${s.priority==='strength'?'selected':''}>Strength emphasis</option><option value="hypertrophy" ${s.priority==='hypertrophy'?'selected':''}>Hypertrophy emphasis</option><option value="recovery" ${s.priority==='recovery'?'selected':''}>Recovery / maintenance</option></select><p class="muted">${count} logged exercises this block, ${hard} below-target performances.</p><button class="primary full" onclick="generate()">Generate next block preview</button><div id="proposal"></div>`)}function setWeek(w){s.week=w;save();render()}function generate(){let l=s.logs.filter(x=>x.block===s.block),struggle=l.filter(x=>x.sets.some(y=>y.r<x.min)).length;let rec=l.length===0?'No performance history yet. Keep conservative baseline loads.':struggle/l.length>.3?'Several lifts missed rep targets. Maintain or reduce load and prioritize recovery.':'Keep successful lifts and progress load only after completing all top-range reps at 1+ RIR.';$('proposal').innerHTML=`<div class="card"><b>Block ${s.block+1} proposal</b><p>${rec}</p><p class="muted">Priority: ${esc(s.priority)}. Four sessions weekly. Week 6 reduced-fatigue review.</p><button class="primary full" onclick="startBlock()">Start next block</button></div>`}function startBlock(){if(s.block>=2)return alert('Your 12-week phase is complete. Export your history before starting another cycle.');s.block++;s.week=1;save();render()}
function settingsView(){return wrap(`<h2>Your plan</h2><div class="item">Goal: lose 10 lb from 217 to 207 in 12 weeks</div><div class="item">4 lifting days · ~55 min sessions</div><div class="item">5 min mobility · 30 min strength · 15 min incline walk · 5 min stretching</div><div class="item">Advanced · Full gym · Strength + muscle</div><p class="notice">Your data is stored in this browser on this device. Clearing browser data or changing devices can erase it. Export backups regularly.</p><button class="primary full" onclick="exportData()">⬇ Export backup (JSON)</button><div class="item"><label>Import an earlier backup</label><input type="file" id="backup" accept=".json,application/json" onchange="importData(event)"></div><button class="secondary full" onclick="if(confirm('Delete all LiftIQ data on this device?')){localStorage.removeItem(KEY);location.reload()}">Reset app data</button>`)}function exportData(){let blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='liftiq-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importData(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.logs)||!Array.isArray(x.weights)||!Array.isArray(x.cardio))throw Error('Invalid backup');if(confirm('Replace current LiftIQ data with this backup?')){s=x;save();render()}}catch{alert('Invalid backup file')}};r.readAsText(f)}function render(){nav();$('app').innerHTML=({Today:todayView,Progress:progressView,History:historyView,Program:programView,Settings:settingsView}[s.tab]||todayView)()}render();
</script></body></html>
